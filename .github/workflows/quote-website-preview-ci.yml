name: Makster Quote Website Preview CI

on:
  push:
    branches:
      - 'makster-quote-website-0.1'
    paths:
      - 'app/**'
      - 'apps/quote/src/app/**'
      - 'apps/quote/src/components/**'
      - 'package.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/quote-website-preview-ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'apps/quote/src/app/**'
      - 'apps/quote/src/components/**'
      - 'package.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/quote-website-preview-ci.yml'

permissions:
  contents: read

jobs:
  build-preview-root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install root preview dependencies
        run: npm install --no-audit --no-fund
      - name: Build root Next.js preview
        run: npm run build
      - name: Build Cloudflare Pages static preview
        env:
          CF_PAGES: '1'
        run: |
          rm -rf .next out
          npm run build
          test -f out/index.html
