name: Makster Quote CI

on:
  pull_request:
    paths:
      - 'apps/quote/**'
      - 'supabase/migrations/**makster_quote**'
      - '.github/workflows/quote-ci.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/quote
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lock
        working-directory: .
        run: |
          if ! git diff --quiet -- apps/quote/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/quote/package-lock.json
            git commit -m "Lock Makster Quote 0.1.4 PDF dependencies"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: PDF smoke
        run: npm run pdf:smoke
      - name: Build
        run: npm run build
