name: Makster Quote CI

on:
  pull_request:
    paths:
      - 'apps/quote/**'
      - 'supabase/migrations/**makster_quote**'
  push:
    branches:
      - 'makster-quote-0.1-core'
    paths:
      - 'apps/quote/**'
      - 'supabase/migrations/**makster_quote**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/quote
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Export generated lockfile
        uses: actions/upload-artifact@v6
        with:
          name: quote-package-lock
          path: apps/quote/package-lock.json
          if-no-files-found: error
          retention-days: 1
